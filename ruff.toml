# Ruff runs with its default rule set, which is what the code was written
# against. The pin in .github/workflows/ci.yml is what keeps that set stable —
# defaults move between ruff releases, and an unpinned bump would arrive as an
# unrelated PR failing to lint.

[lint.per-file-ignores]
# PyInstaller injects Analysis, PYZ, EXE, COLLECT, BUNDLE and SPECPATH into a
# spec file's namespace at exec time, so every one of them reads as undefined.
"packaging/Kaho.spec" = ["F821"]
