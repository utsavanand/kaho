<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 488" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- menu bar strip -->
  <rect x="0" y="0" width="640" height="30" rx="8" fill="#1c1c22"/>
  <text x="512" y="20" font-size="14" fill="#e8e8f0">14:32</text>
  <rect x="440" y="3" width="30" height="24" rx="5" fill="#3a3a44"/>
  <circle cx="455" cy="15" r="8" fill="#e8e8f0"/>
  <path d="M451 13 a2 2 0 0 1 3 0 M457 13 a2 2 0 0 1 3 0" stroke="#2b3154" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M453 18 a2.5 2 0 0 0 5 0" stroke="#2b3154" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <text x="410" y="20" font-size="13" text-anchor="middle" fill="#e8e8f0">⌇</text>

  <!-- dropdown -->
  <g>
    <rect x="300" y="34" width="270" height="446" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <text x="316" y="60" font-size="13" fill="#57606a">14:31</text>
    <text x="360" y="60" font-size="13" fill="#24292f">Ship the fix by Friday.</text>
    <text x="316" y="84" font-size="13" fill="#57606a">14:28</text>
    <text x="360" y="84" font-size="13" fill="#24292f">Move the launch to Thursday…</text>
    <line x1="312" y1="98" x2="558" y2="98" stroke="#d0d7de"/>

    <text x="316" y="122" font-size="13" fill="#24292f">Hotkey</text>
    <text x="550" y="122" font-size="12" text-anchor="end" fill="#57606a">Right Option (⌥) ▸</text>

    <text x="316" y="148" font-size="13" fill="#24292f">Trigger</text>
    <text x="550" y="148" font-size="12" text-anchor="end" fill="#57606a">Hold to dictate ▸</text>

    <text x="316" y="174" font-size="13" fill="#24292f">Language</text>
    <text x="550" y="174" font-size="12" text-anchor="end" fill="#57606a">English ▸</text>

    <text x="316" y="200" font-size="13" fill="#24292f">Rewrite model</text>
    <text x="550" y="200" font-size="12" text-anchor="end" fill="#57606a">On this Mac ▸</text>

    <rect x="306" y="212" width="258" height="24" rx="6" fill="#0a84ff"/>
    <text x="316" y="229" font-size="13" fill="#ffffff">Rewrite</text>
    <text x="550" y="229" font-size="12" text-anchor="end" fill="#dce9ff">▸</text>

    <line x1="312" y1="246" x2="558" y2="246" stroke="#d0d7de"/>
    <text x="316" y="272" font-size="13" fill="#24292f">Settings…</text>
    <text x="550" y="272" font-size="12" text-anchor="end" fill="#57606a">⌘,</text>
    <text x="316" y="298" font-size="13" fill="#24292f">Edit Dictionary…</text>
    <text x="316" y="324" font-size="13" fill="#24292f">History…</text>
    <text x="550" y="324" font-size="12" text-anchor="end" fill="#57606a">⌘H</text>
    <text x="316" y="350" font-size="13" fill="#24292f">Open Log</text>
    <text x="316" y="376" font-size="13" fill="#24292f">Report a Bug…</text>
    <text x="316" y="402" font-size="13" fill="#24292f">Restart Kaho</text>
    <line x1="312" y1="416" x2="558" y2="416" stroke="#d0d7de"/>
    <text x="316" y="440" font-size="13" fill="#24292f">Quit Kaho</text>
    <text x="550" y="440" font-size="12" text-anchor="end" fill="#57606a">⌘Q</text>
  </g>

  <!-- rewrite submenu -->
  <g>
    <rect x="120" y="208" width="170" height="117" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <text x="140" y="232" font-size="13" fill="#24292f">Off</text>
    <text x="128" y="259" font-size="13" fill="#0a84ff">✓</text>
    <text x="140" y="259" font-size="13" fill="#24292f">Clean up</text>
    <text x="140" y="286" font-size="13" fill="#24292f">Structured</text>
    <text x="140" y="313" font-size="13" fill="#24292f">Caveman</text>
  </g>
</svg>
