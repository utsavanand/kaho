name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.16.5
      # Every Python file, not just kaho.py — tools/check_docs_sync.py had
      # five findings nothing was looking at. The spec has to be named
      # explicitly because ruff only discovers .py by extension.
      - run: ruff check . packaging/Kaho.spec
      - run: python -m py_compile kaho.py tools/check_docs_sync.py
      # These are zsh scripts, and bash -n was only approximating them
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - run: zsh -n install.sh run.sh packaging/release.sh packaging/setup-signing.sh
      # Illustrations drifted behind renamed modes and new menu items three
      # times before this check existed
      - run: python tools/check_docs_sync.py

  # No dependencies and no Mac: the suite stubs AppKit, Quartz, sounddevice and
  # the MLX packages in sys.modules, so the logic that keeps breaking by hand —
  # the tap state machine, the settings migration, the recording handoff — is
  # covered on a plain Linux runner. See tests/test_kaho.py.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      # numpy is the one real dependency the suite needs: the audio drop rules
      # work on arrays, and tests/test_kaho.py skips those cases without it
      - run: pip install "numpy>=2.5,<3"
      - run: python -m unittest discover -s tests -t . -v

  # arm64 macOS runner: resolves the hashed lock exactly as install.sh will,
  # so a malformed or incomplete lock cannot merge undetected
  lock-check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install --dry-run --require-hashes --no-deps -r requirements.lock

      # Importing under real PyObjC is the only way to catch a selector whose
      # name does not match its arity: PyObjC maps each underscore in a method
      # name to a colon, so show_problem_ becomes show:problem: and raises
      # BadPrototypeError at class-creation time. The unit tests mock AppKit,
      # so they pass while the app cannot start at all — which has now
      # happened three times in this codebase.
      - name: import under real PyObjC
        run: |
          pip install --quiet pyobjc-framework-Cocoa pyobjc-framework-Quartz pyobjc-framework-ApplicationServices
          python - <<'EOF'
          import sys, types, unittest.mock as mock
          for name in ("mlx_audio", "mlx_audio.stt", "mlx_audio.stt.utils",
                       "huggingface_hub", "sounddevice", "numpy"):
              sys.modules.setdefault(name, mock.MagicMock())
          sys.modules["mlx_audio.stt.utils"].load_model = mock.MagicMock()
          sys.modules["sounddevice"].PortAudioError = type("PortAudioError", (Exception,), {})
          import ctypes; ctypes.CDLL = mock.MagicMock()
          import kaho
          print("selectors valid")
          EOF
